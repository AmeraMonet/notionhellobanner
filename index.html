<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greeting Message</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: darkgreen;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Garamond, "EB Garamond", Georgia, serif;
    }

    #lbl {
      width: 100%;
      text-align: center;
      color: white;
      line-height: 1.5;
      padding: 20px;
      box-sizing: border-box;
    }

    #greeting {
      font-size: 36px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    #date {
      margin-top: 10px;
      font-size: 18px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

<div id="lbl">
  <div id="greeting"></div>
  <div id="date"></div>
</div>

<script>
const weekdays = [
  "Sunday",
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday"
];

const today = new Date();
const hrs = today.getHours();

let greeting = "";

if (hrs < 12) {
  greeting = "Good Morning";
} else if (hrs < 18) {
  greeting = "Good Afternoon";
} else {
  greeting = "Good Evening";
}

const date = `${weekdays[today.getDay()]}, ${today.toLocaleDateString("en-US", {
  month: "long",
  day: "numeric",
  year: "numeric"
})}`;

document.getElementById("greeting").textContent = `${greeting}, Amera`;
document.getElementById("date").textContent = date;
</script>

</body>
</html>
